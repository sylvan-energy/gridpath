[tool.setuptools]
include-package-data = true
# so the DB metadata can record the version
py-modules = ["version"]

[tool.setuptools.packages.find]
# Flat layout with multiple top-level packages — auto-discovery would error,
# so list them explicitly. `ui` has no __init__.py and has never shipped in
# the wheel (its entry points work only in editable installs); `tests` is
# deliberately not packaged.
include = ["gridpath*", "db*", "viz*", "data_toolkit*", "ra_toolkit*"]
# find_packages() semantics: only dirs with __init__.py (the pyproject default
# of namespaces = true would pull in e.g. db/csvs_test_examples/*/doc.py)
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }
