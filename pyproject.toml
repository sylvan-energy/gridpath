# Toolkit step registries: gridpath_run_data_toolkit and
# gridpath_run_ra_toolkit resolve the steps named in a settings CSV's
# 'script' column from their respective groups. Entry name = step name (the
# settings-CSV / --single_step_only vocabulary); value = the module
# implementing it, which must expose main(args_list) and
# parse_arguments(args_list). Other installed packages can register
# additional steps in these groups. NOTE: editable installs pick up changes
# here only after re-running 'pip install -e .'.
