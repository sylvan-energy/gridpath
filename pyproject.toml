[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "GridPath"
dynamic = ["version"]
description = "A versatile simulation and optimization platform for power-system planning and operations."
readme = "README.md"
license = "Apache-2.0"
maintainers = [
    { name = "Sylvan Energy Analytics LLC", email = "info@sylvan.energy" },
]
keywords = ["energy", "electricity", "power", "renewables", "planning", "operations"]
requires-python = ">=3.11"
dependencies = [
    "Pyomo==6.10.1", # Optimization modeling language
    "pandas==3.0.3", # Data-processing
    "bokeh==3.9.1", # Visualization library
    "pscript==0.8.1", # Python to JavaScript compiler (for viz)
    "networkx==3.6.1", # network package for DC OPF
    "PyUtilib==6.0.0", # used for solver temp file management
    "highspy==1.15.1", # HiGHS Python interface (default solver)
    # HiGHS plugin shipping the BLAS/AMD/METIS libraries the HiPO parallel
    # interior-point algorithm needs; must always move together with the
    # highspy pin above.
    "highspy-extras==1.15.1", # HiPO dependencies for highspy
    "dill==0.4.1", # pickling
    "duckdb==1.5.4", # data-handling
    "sphinx-rtd-theme", # documentation theme
]

[project.urls]
Homepage = "https://www.gridpath.io"
Discussions = "https://github.com/sylvan-energy/gridpath/discussions"
Documentation = "https://gridpath.readthedocs.io/en/latest/"
Issues = "https://github.com/sylvan-energy/gridpath/issues"
"Source Code" = "https://github.com/sylvan-energy/gridpath"

# Note: df2img (used only by doc/opchar_img_gen.py, a standalone script that
# regenerates the checked-in opchar diagram images) is deliberately NOT
# listed here: its pandas<3.0 constraint can never be satisfied alongside
# GridPath's own pandas==3.0.3 pin in dependencies (extras are additive,
# not a replacement). Read the Docs builds straight from doc/source/conf.py
# and never touches df2img/opchar_img_gen.py, since the images are
# pre-generated and committed to doc/graphics/. To regenerate them after
# editing opchar_param_requirements.csv, install df2img in a separate
# throwaway environment (e.g. its own venv with an older pandas) and run
# opchar_img_gen.py there directly.
[project.optional-dependencies]
doc = [
    "Sphinx==7.2.6",
    "sphinx-argparse==0.4.0",
]
coverage = [
    "coverage", # test coverage
    "coveralls", # automated coverage results
]
gurobi = ["gurobipy"] # Gurobi Python interface
parallel_tests = [
    "pytest", # test runner (collects the unittest suite as is)
    "pytest-xdist", # parallel test execution (see scripts/run_tests_parallel.py)
    "pytest-cov", # coverage measurement that reaches the xdist workers
]
all = [
    "GridPath[doc,coverage,gurobi,parallel_tests]",
    "black",
]

[project.scripts]
gridpath = "gridpath.cli:main"
gridpath_run = "gridpath.run_scenario:cli"
gridpath_run_parallel = "gridpath.run_scenario_parallel:main"
gridpath_run_e2e = "gridpath.run_end_to_end:cli"
gridpath_get_inputs = "gridpath.get_scenario_inputs:main"
gridpath_import_results = "gridpath.import_scenario_results:cli"
gridpath_process_results = "gridpath.process_results:main"
gridpath_validate = "gridpath.validate_inputs:main"
gridpath_run_server = "ui.server.run_server:main"
gridpath_run_queue_manager = "ui.server.run_queue_manager:main"
gridpath_create_database = "db.create_database:main"
gridpath_load_csvs = "db.utilities.port_csvs_to_db:main"
gridpath_load_scenarios = "db.utilities.scenario:main"
gridpath_get_pudl_data = "data_toolkit.raw_data.pudl.download_data_from_pudl:main"
